name: Daily rotation

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test renderer
        run: node --test

      - name: Render daily selection
        run: node scripts/render-daily-rotation.mjs

      - name: Commit changed cards
        run: |
          if git diff --quiet -- assets/daily-rotation-*.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daily-rotation-*.svg
          git commit -m "profile: update daily rotation"
          git push
