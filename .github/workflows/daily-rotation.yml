name: Daily rotation

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rotation-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test renderer
        run: node --test

      - name: Render daily selection
        run: node scripts/render-daily-rotation.mjs --output-dir="$RUNNER_TEMP/rotation"

      - uses: actions/checkout@v4
        with:
          ref: generated-assets
          path: generated-assets

      - name: Publish generated cards
        run: |
          mkdir -p generated-assets/generated/design-1
          cp "$RUNNER_TEMP"/rotation/*.svg generated-assets/generated/design-1/
          cd generated-assets

          if git diff --quiet -- generated/design-1; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/design-1
          git commit -m "rotation: update design-1"
          git push origin HEAD:generated-assets
